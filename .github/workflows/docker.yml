name: Build and push Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push labby
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            LABBY_VERSION=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/labby:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/labby:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push kontainr-proxy
        uses: docker/build-push-action@v6
        with:
          context: ./deploy
          file: ./deploy/Dockerfile.kontainr-proxy
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/labby-kontainr-proxy:latest

      # Tells the running Labby to pull what we just pushed — the same self-update
      # the Settings page runs. Skipped (not failed) when the secrets aren't set, so
      # forks and anyone without a reachable deployment still get a green build.
      - name: Deploy — trigger Labby self-update
        env:
          LABBY_DEPLOY_URL: ${{ secrets.LABBY_DEPLOY_URL }}
          LABBY_DEPLOY_TOKEN: ${{ secrets.LABBY_DEPLOY_TOKEN }}
          # Only needed when Cloudflare Access (or similar) fronts Labby — see README.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$LABBY_DEPLOY_URL" ] || [ -z "$LABBY_DEPLOY_TOKEN" ]; then
            echo "LABBY_DEPLOY_URL/LABBY_DEPLOY_TOKEN not set — skipping deploy."
            exit 0
          fi

          access=()
          if [ -n "$CF_ACCESS_CLIENT_ID" ] && [ -n "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "Using a Cloudflare Access service token."
            access=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"
                    -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi

          # Read the status ourselves rather than leaning on `curl -f`: -f ignores
          # 3xx, so an Access/login redirect in front of Labby would otherwise look
          # like a successful deploy. Retries cover the container restarting itself.
          code=$(curl -sS -o response.txt -w '%{http_code}' \
            --max-time 60 --retry 3 --retry-delay 10 --retry-connrefused \
            -X POST "$LABBY_DEPLOY_URL/api/deploy" \
            -H "Authorization: Bearer $LABBY_DEPLOY_TOKEN" "${access[@]}")
          echo "HTTP $code"
          cat response.txt; echo

          case "$code" in
            2*) echo "Deploy accepted — Labby restarts on the new image shortly." ;;
            3*) echo "::error::Redirected (HTTP $code) — something in front of Labby intercepted the request. If that is Cloudflare Access, add a service token (CF_ACCESS_CLIENT_ID/CF_ACCESS_CLIENT_SECRET secrets) or a bypass policy for /api/deploy."
                exit 1 ;;
            401) echo "::error::Rejected (401) — LABBY_DEPLOY_TOKEN does not match Updates__DeployToken on the host."
                exit 1 ;;
            404) echo "::error::Not enabled (404) — Updates__DeployToken is unset on the host, or the container wasn't recreated after setting it."
                exit 1 ;;
            *)  echo "::error::Deploy hook failed with HTTP $code."
                exit 1 ;;
          esac
